<VirtualHost *:80>
  DocumentRoot "/var/www/html/public"

  <Directory "/var/www/html/public">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    FallbackResource /index.php
  </Directory>

  <FilesMatch ".php$">
     SetHandler "proxy:unix:/var/run/php/php8.2-fpm.sock|fcgi://localhost/"
  </FilesMatch>
</VirtualHost>
