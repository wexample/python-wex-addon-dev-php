services:
  wordpress:
    container_name: ${APP_PROJECT_NAME}_wordpress
    image: wordpress:6.3.1-php8.2-apache
    expose:
      - 80
    environment:
      - VIRTUAL_HOST=${APP_DOMAINS_STRING}
      - VIRTUAL_PORT=80
      - WORDPRESS_DB_HOST=${SERVICE_MYSQL_HOST}
      - WORDPRESS_DB_NAME=${SERVICE_MYSQL_NAME}
      - WORDPRESS_DB_USER=${SERVICE_MYSQL_USER}
      - WORDPRESS_DB_PASSWORD=${SERVICE_MYSQL_PASSWORD}
      - APP_DOMAIN=${APP_DOMAIN}
    volumes:
      - ${APP_PATH}:/var/www/html
      - /var/www/html/.git
      - /var/www/html/.wex
    extends:
      file: ${SERVICE_DEFAULT_COMPOSE}
      service: default

  wordpress_cli:
    container_name: ${APP_PROJECT_NAME}_wordpress_cli
    image: wordpress:cli-2.7.1-php8.2
    environment:
      - WORDPRESS_DB_HOST=${SERVICE_MYSQL_HOST}
      - WORDPRESS_DB_NAME=${SERVICE_MYSQL_NAME}
      - WORDPRESS_DB_USER=${SERVICE_MYSQL_USER}
      - WORDPRESS_DB_PASSWORD=${SERVICE_MYSQL_PASSWORD}
      - APP_DOMAIN=${APP_DOMAIN}
    volumes:
      - ${APP_PATH}:/var/www/html
      - /var/www/html/.git
      - /var/www/html/.wex
      - ${APP_SETUP_PATH}env/${APP_ENV}/wp-cli:/.wp-cli/
    extends:
      file: ${SERVICE_DEFAULT_COMPOSE}
      service: default
