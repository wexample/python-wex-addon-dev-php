description: Disable Laravel maintenance mode (php artisan up)
decorators:
  - name: tags
    args:
      - domain:app-lifecycle
      - domain:framework
      - domain:language-php
      - effect:write
      - audience:agent-safe
      - scope:app
      - scope:local
  - name: attach
    args:
      position: after
      command: app::maintenance/disable
scripts:
  - runner: docker
    service: laravel
    shell: sh
    script: php artisan up
    app_should_run: true
