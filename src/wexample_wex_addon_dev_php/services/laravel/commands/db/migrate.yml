description: Run Laravel database migrations (php artisan migrate)
decorators:
  - name: tags
    args:
      - domain:db
      - domain:framework
      - domain:language-php
      - effect:write
      - audience:agent-safe
      - scope:app
      - scope:local
  - name: attach
    args:
      position: before
      command: app::maintenance/disable
scripts:
  - runner: docker
    service: laravel
    shell: sh
    script: php artisan migrate --force --no-interaction -vvv
